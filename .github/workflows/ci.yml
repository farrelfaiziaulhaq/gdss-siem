name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Pasang cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Pasang cargo-leptos
        run: cargo binstall -y cargo-leptos

      - name: Periksa kompilasi (SSR & WASM)
        run: |
          cargo check --features ssr
          cargo check --lib --features hydrate --target wasm32-unknown-unknown

      - name: Unit test (ROC, SAW, Borda)
        run: cargo test --features ssr --lib

      - name: Build lengkap
        run: cargo leptos build

  check-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi sintaks skrip PowerShell & Python
        shell: pwsh
        run: |
          foreach ($f in @("setup.ps1", "run.ps1", "scripts/package_release.ps1")) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "OK: $f"
          }
          python -m py_compile scripts/seed_emulator.py

      - name: Pasang Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Periksa kompilasi Windows (SSR & WASM)
        run: |
          cargo check --features ssr
          cargo check --lib --features hydrate --target wasm32-unknown-unknown

      - name: Unit test Windows (ROC, SAW, Borda)
        run: cargo test --features ssr --lib

  lint:
    name: Format, Clippy & Skrip Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Periksa format & clippy
        run: |
          cargo fmt -- --check
          cargo clippy --features ssr -- -D warnings
          cargo clippy --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings

      - name: Validasi sintaks Python & Bash
        run: |
          python3 -m py_compile scripts/seed_emulator.py
          bash -n setup.sh run.sh scripts/dev.sh scripts/package_release.sh
