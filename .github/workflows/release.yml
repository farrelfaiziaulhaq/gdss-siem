name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versi (mis. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Paket Rilis Linux x86_64 (.tar.gz)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Pasang cargo-binstall & cargo-leptos
        uses: cargo-bins/cargo-binstall@main

      - name: Pasang biner cargo-leptos
        run: cargo binstall -y cargo-leptos

      - name: Unit test
        run: cargo test --features ssr --lib

      - name: Build release & kemas .tar.gz
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          bash scripts/package_release.sh "$TAG"

      - name: Unggah artefak Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  build-windows:
    name: Paket Rilis Windows x86_64 (.zip)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Pasang cargo-binstall & cargo-leptos
        uses: cargo-bins/cargo-binstall@main

      - name: Pasang biner cargo-leptos
        run: cargo binstall -y cargo-leptos

      - name: Unit test
        run: cargo test --features ssr --lib

      - name: Build release & kemas .zip
        shell: pwsh
        run: |
          $Tag = "${{ github.event.inputs.tag || github.ref_name }}"
          ./scripts/package_release.ps1 -Version $Tag

      - name: Unggah artefak Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256

  publish:
    name: Terbitkan GitHub Release (Windows + Linux)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Unduh semua artefak
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Daftar berkas rilis
        run: ls -lh release-assets/

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "GDSS Pemilihan SIEM ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          body: |
            ### Paket Siap Pakai (Tanpa Perlu Install Rust / Kompilasi)

            Pilih sesuai sistem operasi Anda:

            #### Windows 10 / 11 (`x86_64`)
            1. Unduh **`gdss-siem-${{ github.event.inputs.tag || github.ref_name }}-windows-x86_64.zip`** lalu klik kanan -> **Extract All**.
            2. Klik dua kali **`start.bat`** (otomatis mengecek/memasang dependensi runtime, menyalakan Firebase Emulator, mengisi akun & data awal, lalu membuka `http://127.0.0.1:3000` di browser).
            3. Tersedia juga **`demo-siap-voting.bat`** (langsung mengisi penilaian contoh 3 DM agar CISO siap menekan tombol voting) dan **`reset-data.bat`**.

            #### Linux (`x86_64`)
            ```bash
            curl -fL https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/gdss-siem-${{ github.event.inputs.tag || github.ref_name }}-linux-x86_64.tar.gz | tar -xz
            cd gdss-siem-${{ github.event.inputs.tag || github.ref_name }}-linux-x86_64
            ./start.sh
            ```
          files: |
            release-assets/*
